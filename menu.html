.profil{padding:34px 28px 26px;border-bottom:1px solid #374151;text-align:center}

.profil b{display:block;font-size:17px}.profil small{color:#9ca3af;font-size:13px}
nav{padding:18px 0}

m.forEach(function(a){a.addEventListener('click',function(){m.forEach(function(x){x.classList.remove('aktif')});a.classList.add('aktif')})});
</script>
